<svg xmlns="http://www.w3.org/2000/svg" width="1464" height="1371" viewBox="0 0 1464 1371" role="img" aria-label="业务流程前后对照"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#6d7c89"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="24" y="30" font-size="21" fill="#152d3e">模拟实跑：工厂询价与报价准备</text><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="24" y="80" font-size="22">改造前</text><rect x="24" y="115" width="535" height="143" rx="10" fill="#f0f3f6" stroke="#b5c2cc"/><text x="38" y="140" font-size="16" fill="#172e3d">b1 · 销售 · 演示假设</text><text x="38" y="163" font-size="16" fill="#172e3d">动作：接收并手动登记询价</text><text x="38" y="186" font-size="16" fill="#172e3d">输入：Q001 消息及图片</text><text x="38" y="209" font-size="16" fill="#172e3d">输出：初始询价记录</text><text x="38" y="232" font-size="16" fill="#172e3d">条件：登记完成 → b2</text><path d="M559 186.5 H576 V393.0 H559" fill="none" stroke="#6d7c89" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="310" width="535" height="166" rx="10" fill="#f0f3f6" stroke="#b5c2cc"/><text x="38" y="335" font-size="16" fill="#172e3d">b2 · 技术 · 演示假设</text><text x="38" y="358" font-size="16" fill="#172e3d">动作：检查规格并查历史资料</text><text x="38" y="381" font-size="16" fill="#172e3d">输入：初始询价记录</text><text x="38" y="404" font-size="16" fill="#172e3d">输出：缺尺寸或可报价资料</text><text x="38" y="427" font-size="16" fill="#172e3d">异常：缺少尺寸 → b3</text><text x="38" y="450" font-size="16" fill="#172e3d">条件：信息完整 → b4</text><path d="M559 393.0 H591 V611.0 H559" fill="none" stroke="#a96920" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M559 393.0 H606 V806.0 H559" fill="none" stroke="#6d7c89" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="528" width="535" height="166" rx="10" fill="#f0f3f6" stroke="#b5c2cc"/><text x="38" y="553" font-size="16" fill="#172e3d">b3 · 销售 · 演示假设</text><text x="38" y="576" font-size="16" fill="#172e3d">动作：向客户补问尺寸</text><text x="38" y="599" font-size="16" fill="#172e3d">输入：缺项清单</text><text x="38" y="622" font-size="16" fill="#172e3d">输出：补齐的规格或人工关闭</text><text x="38" y="645" font-size="16" fill="#172e3d">条件：客户补齐 → b2</text><text x="38" y="668" font-size="16" fill="#172e3d">异常：客户取消或长期无回复，人工结案 → b5</text><path d="M559 611.0 H621 V393.0 H559" fill="none" stroke="#6d7c89" stroke-width="2" marker-end="url(#arrow)"/><path d="M559 611.0 H636 V978.0 H559" fill="none" stroke="#a96920" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="24" y="746" width="535" height="120" rx="10" fill="#f0f3f6" stroke="#b5c2cc"/><text x="38" y="771" font-size="16" fill="#172e3d">b4 · 技术与销售 · 演示假设</text><text x="38" y="794" font-size="16" fill="#172e3d">动作：技术准备报价，销售审核发送</text><text x="38" y="817" font-size="16" fill="#172e3d">输入：完整规格与有效报价依据</text><text x="38" y="840" font-size="16" fill="#172e3d">输出：发送的报价及登记结果</text><rect x="24" y="918" width="535" height="120" rx="10" fill="#f0f3f6" stroke="#b5c2cc"/><text x="38" y="943" font-size="16" fill="#172e3d">b5 · 销售 · 演示假设</text><text x="38" y="966" font-size="16" fill="#172e3d">动作：关闭未完成询价</text><text x="38" y="989" font-size="16" fill="#172e3d">输入：取消或无回复的询价</text><text x="38" y="1012" font-size="16" fill="#172e3d">输出：结案记录</text></g><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="744" y="80" font-size="22">改造后</text><rect x="744" y="115" width="535" height="166" rx="10" fill="#e9f4ef" stroke="#b5c2cc"/><text x="758" y="140" font-size="16" fill="#172e3d">a1 · 系统与销售 · 演示假设</text><text x="758" y="163" font-size="16" fill="#172e3d">动作：提取需求并校验必填字段</text><text x="758" y="186" font-size="16" fill="#172e3d">输入：同一份 Q001 消息及图片</text><text x="758" y="209" font-size="16" fill="#172e3d">输出：结构化规格及缺项标记</text><text x="758" y="232" font-size="16" fill="#172e3d">异常：缺少尺寸或提取不确定 → a2</text><text x="758" y="255" font-size="16" fill="#172e3d">条件：字段齐全且已核对 → a3</text><path d="M1279 198.0 H1296 V416.0 H1279" fill="none" stroke="#a96920" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M1279 198.0 H1311 V634.0 H1279" fill="none" stroke="#6d7c89" stroke-width="2" marker-end="url(#arrow)"/><rect x="744" y="333" width="535" height="166" rx="10" fill="#f0f3f6" stroke="#b5c2cc"/><text x="758" y="358" font-size="16" fill="#172e3d">a2 · 销售 · 演示假设</text><text x="758" y="381" font-size="16" fill="#172e3d">动作：补问尺寸并核对提取结果</text><text x="758" y="404" font-size="16" fill="#172e3d">输入：原文和缺项标记</text><text x="758" y="427" font-size="16" fill="#172e3d">输出：补齐规格或人工关闭</text><text x="758" y="450" font-size="16" fill="#172e3d">条件：收到补充并重新校验 → a1</text><text x="758" y="473" font-size="16" fill="#172e3d">异常：客户取消或长期无回复，人工结案 → a6</text><path d="M1279 416.0 H1326 V198.0 H1279" fill="none" stroke="#6d7c89" stroke-width="2" marker-end="url(#arrow)"/><path d="M1279 416.0 H1341 V1219.0 H1279" fill="none" stroke="#a96920" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="744" y="551" width="535" height="166" rx="10" fill="#e9f4ef" stroke="#b5c2cc"/><text x="758" y="576" font-size="16" fill="#172e3d">a3 · 规则系统 · 演示假设</text><text x="758" y="599" font-size="16" fill="#172e3d">动作：按有效规则准备报价草稿</text><text x="758" y="622" font-size="16" fill="#172e3d">输入：完整规格与价格规则</text><text x="758" y="645" font-size="16" fill="#172e3d">输出：带依据版本的报价草稿或例外</text><text x="758" y="668" font-size="16" fill="#172e3d">条件：规则可用且属于标准件 → a5</text><text x="758" y="691" font-size="16" fill="#172e3d">异常：非标、规则冲突或读取失败 → a4</text><path d="M1279 634.0 H1356 V1047.0 H1279" fill="none" stroke="#6d7c89" stroke-width="2" marker-end="url(#arrow)"/><path d="M1279 634.0 H1371 V852.0 H1279" fill="none" stroke="#a96920" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="744" y="769" width="535" height="166" rx="10" fill="#f0f3f6" stroke="#b5c2cc"/><text x="758" y="794" font-size="16" fill="#172e3d">a4 · 技术 · 演示假设</text><text x="758" y="817" font-size="16" fill="#172e3d">动作：处理例外并准备报价</text><text x="758" y="840" font-size="16" fill="#172e3d">输入：原始需求及失败记录</text><text x="758" y="863" font-size="16" fill="#172e3d">输出：人工确认的报价依据</text><text x="758" y="886" font-size="16" fill="#172e3d">条件：专业评估完成 → a5</text><text x="758" y="909" font-size="16" fill="#172e3d">异常：无法提供可靠报价，人工结案 → a6</text><path d="M1279 852.0 H1386 V1047.0 H1279" fill="none" stroke="#6d7c89" stroke-width="2" marker-end="url(#arrow)"/><path d="M1279 852.0 H1401 V1219.0 H1279" fill="none" stroke="#a96920" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="744" y="987" width="535" height="120" rx="10" fill="#f0f3f6" stroke="#b5c2cc"/><text x="758" y="1012" font-size="16" fill="#172e3d">a5 · 销售 · 演示假设</text><text x="758" y="1035" font-size="16" fill="#172e3d">动作：审核并发送报价，记录版本</text><text x="758" y="1058" font-size="16" fill="#172e3d">输入：报价草稿及依据</text><text x="758" y="1081" font-size="16" fill="#172e3d">输出：发送的报价与可追踪记录</text><rect x="744" y="1159" width="535" height="120" rx="10" fill="#f0f3f6" stroke="#b5c2cc"/><text x="758" y="1184" font-size="16" fill="#172e3d">a6 · 销售 · 演示假设</text><text x="758" y="1207" font-size="16" fill="#172e3d">动作：关闭无法完成的询价</text><text x="758" y="1230" font-size="16" fill="#172e3d">输入：取消、无回复或无法报价原因</text><text x="758" y="1253" font-size="16" fill="#172e3d">输出：结案记录</text></g></svg>